<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar · Vanilla JS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <button type="button" id="prev">←</button>
      <h1 id="label"></h1>
      <button type="button" id="next">→</button>
    </header>
    <form id="form">
      <input id="title" placeholder="Evento" required />
      <input id="date" type="date" required />
      <button type="submit">+</button>
    </form>
    <div class="week">L M M J V S D</div>
    <div class="grid" id="grid"></div>
    <script src="app.js"></script>
  </body>
</html>
